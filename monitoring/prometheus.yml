global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Scrape every minitwit replica.
  # `tasks.<service>` is a Swarm-internal DNS name that returns the IP of every running task,
  # unlike `<service>` which only returns one IP per query.
  - job_name: 'minitwit_app'
    dns_sd_configs:
      - names: ['tasks.minitwit']
        type: 'A'
        port: 5000
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # node-exporter runs in `mode: global`, so one task per node (manager + each worker).
  - job_name: 'infrastructure_node'
    dns_sd_configs:
      - names: ['tasks.node-exporter']
        type: 'A'
        port: 9100
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # cAdvisor runs in `mode: global`, one task per node, scraped via overlay DNS.
  - job_name: 'cadvisor'
    dns_sd_configs:
      - names: ['tasks.cadvisor']
        type: 'A'
        port: 8080
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # mysqld-exporter scrapes the managed MySQL DB.
  - job_name: 'mysqld_exporter'
    static_configs:
      - targets: ['mysqld-exporter:9104']

  # Self-scrape so Prometheus health is visible in Grafana.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
