version: '3.8'

# Port-publishing strategy (see SECURITY.md §2.A):
#
#   - Public services (nginx :80, :443) use ingress mode → reachable on the
#     manager droplet's public IP.
#   - Admin/observability services (Prometheus, Grafana, Loki) use long-form
#     `mode: host` + `host_ip: 127.0.0.1` so they bind ONLY to the manager's
#     loopback. Reach them via SSH tunnel:
#         ssh -L 3000:127.0.0.1:3000 root@<droplet>
#     This is necessary because Docker writes iptables rules directly and
#     bypasses ufw — relying only on ufw to "block" 3000/9090/3100 does NOT
#     work in Swarm mode (lecture: ElasticSearch ransom story).
#   - minitwit, node-exporter, promtail have NO host port — they're reached
#     via Swarm overlay DNS (tasks.<service>:<port>), which is what nginx and
#     Prometheus already do.

networks:
  minitwit_net:
    driver: overlay
    attachable: true

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - minitwit_net
    deploy:
      replicas: 1
      # Bake the nginx config hash into a label. When nginx.conf content
      # changes (e.g. setup-tls.sh has flipped it to HTTPS mode), the spec
      # changes and Swarm rolls the nginx service. Without this, bind-mount
      # content changes wouldn't trigger a restart.
      labels:
        - "config.version=${NGINX_CONFIG_VERSION:-default}"
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
      restart_policy:
        condition: any

  minitwit:
    image: michaelfant/minitwitimage:latest
    env_file:
      - .env
    # No host port — nginx reaches us over the overlay network
    # via Swarm DNS (`tasks.minitwit:5000`).
    networks:
      - minitwit_net
    deploy:
      replicas: 3
      placement:
        # Keep app off the manager: the manager is reserved for the observability stack.
        constraints:
          - node.role == worker
        # With 2 workers + 3 replicas this forces a 2/1 spread instead of 3/0.
        max_replicas_per_node: 2
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
      update_config:
        delay: 10s
        order: start-first
      restart_policy:
        condition: any

  flagtool:
    image: michaelfant/flagtoolimage:latest
    networks:
      - minitwit_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          memory: 100M
        reservations:
          memory: 50M

  prometheus:
    image: prom/prometheus:latest
    # Cap retention so the TSDB never blows the manager disk.
    # 7 days of history OR 512MB on disk, whichever comes first.
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=512MB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - target: 9090
        published: 9090
        protocol: tcp
        mode: host
        host_ip: 127.0.0.1
    networks:
      - minitwit_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 256M

  grafana:
    image: grafana/grafana:latest
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: host
        host_ip: 127.0.0.1
    volumes:
      - ./monitoring/grafana/provisioning/:/etc/grafana/provisioning/
      - ./monitoring/grafana/dashboards/:/var/lib/grafana/dashboards/
      - grafana_data:/var/lib/grafana
    environment:
      # Pull the admin password from the host environment instead of hard-coding it.
      # Production must set GF_SECURITY_ADMIN_PASSWORD in .env.
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set in .env}
    networks:
      - minitwit_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 128M

  node-exporter:
    image: prom/node-exporter:latest
    # No host port — Prometheus scrapes us via overlay DNS
    # (`tasks.node-exporter:9100`).
    networks:
      - minitwit_net
    deploy:
      mode: global
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  loki:
    image: grafana/loki:2.9.4
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/loki-config.yaml
      - loki_data:/loki
    ports:
      - target: 3100
        published: 3100
        protocol: tcp
        mode: host
        host_ip: 127.0.0.1
    networks:
      - minitwit_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 350M
        reservations:
          memory: 256M

  promtail:
    image: grafana/promtail:2.9.4
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    configs:
      - source: promtail_config
        target: /etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - minitwit_net
    deploy:
      mode: global
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

configs:
  promtail_config:
    name: ${PROMTAIL_CONFIG_NAME:-promtail_config}
    external: true

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
