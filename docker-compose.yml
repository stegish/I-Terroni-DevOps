# No top-level `version:` key — that pins us to the legacy v3.x schema.
# We want the modern Compose Specification, which is selected by default
# when `version:` is absent.

# Port-publishing strategy (see SECURITY.md §2.A):
#
#   - Public services (nginx :80, :443) use ingress mode → reachable on the
#     manager droplet's public IP.
#   - Admin/observability services (Prometheus, Grafana, Loki) use long-form
#     `mode: host`. Originally we also set `host_ip: 127.0.0.1` to bind only
#     to loopback, but the docker stack-deploy parser on the current
#     droplet's engine rejects that property. Until the droplet is on Docker
#     >= 24.0.x (which the new Terraform-provisioned droplets are), these
#     services bind to 0.0.0.0:{3000,9090,3100} on the host. They're
#     protected by:
#         (a) `mode: host` bypasses Swarm ingress, so iptables-DOCKER doesn't
#             punch through — ufw rules on the host actually apply.
#         (b) the DigitalOcean cloud firewall declared in
#             infrastructure/firewall.tf rejects these ports at the cloud
#             edge once the cluster is Terraform-managed.
#     Reach them via SSH tunnel: `ssh -L 3000:127.0.0.1:3000 root@<droplet>`.
#   - minitwit, node-exporter, promtail have NO host port — they're reached
#     via Swarm overlay DNS (tasks.<service>:<port>), which is what nginx and
#     Prometheus already do.

networks:
  minitwit_net:
    driver: overlay
    attachable: true

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - minitwit_net
    deploy:
      replicas: 1
      # Bake the nginx config hash into a label. When nginx.conf content
      # changes (e.g. setup-tls.sh has flipped it to HTTPS mode), the spec
      # changes and Swarm rolls the nginx service. Without this, bind-mount
      # content changes wouldn't trigger a restart.
      labels:
        - "config.version=${NGINX_CONFIG_VERSION:-default}"
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
      restart_policy:
        condition: any

  minitwit:
    image: michaelfant/minitwitimage:latest
    env_file:
      - .env
    # No host port — nginx reaches us over the overlay network
    # via Swarm DNS (`tasks.minitwit:5000`).
    networks:
      - minitwit_net
    deploy:
      replicas: 3
      placement:
        # Keep app off the manager: the manager is reserved for the observability stack.
        constraints:
          - node.role == worker
        # With 2 workers + 3 replicas this forces a 2/1 spread instead of 3/0.
        max_replicas_per_node: 2
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
      update_config:
        delay: 10s
        order: start-first
      restart_policy:
        condition: any

  flagtool:
    image: michaelfant/flagtoolimage:latest
    networks:
      - minitwit_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          memory: 100M
        reservations:
          memory: 50M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s

  prometheus:
    image: prom/prometheus:v2.55.1
    # Cap retention so the TSDB never blows the manager disk.
    # 7 days of history OR 512MB on disk, whichever comes first.
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=512MB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - target: 9090
        published: 9090
        protocol: tcp
        mode: host
    networks:
      - minitwit_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 280M
        reservations:
          memory: 150M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: host
    volumes:
      - ./monitoring/grafana/provisioning/:/etc/grafana/provisioning/
      - ./monitoring/grafana/dashboards/:/var/lib/grafana/dashboards/
      - grafana_data:/var/lib/grafana
    environment:
      # Pull the admin password from the host environment instead of hard-coding it.
      # Production must set GF_SECURITY_ADMIN_PASSWORD in .env.
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set in .env}
      # WAL mode = durable writes even if the container is killed mid-transaction.
      - GF_DATABASE_WAL=true
    networks:
      - minitwit_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 280M
        reservations:
          memory: 150M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s

  # Daily hot-backup of Grafana's SQLite DB. Keeps 7 rotating snapshots inside
  # grafana_backups so users/dashboards survive a corrupted grafana.db.
  # Restore: stop grafana, copy a backup over /var/lib/grafana/grafana.db, restart.
  grafana-backup:
    image: alpine:3.20
    volumes:
      - grafana_data:/source
      - grafana_backups:/backups
    command:
      - sh
      - -c
      - |
        apk add --no-cache sqlite >/dev/null
        while true; do
          STAMP=$$(date +%Y-%m-%d)
          sqlite3 /source/grafana.db ".backup /backups/grafana-$$STAMP.db" \
            && echo "[$$(date -Iseconds)] backup ok: grafana-$$STAMP.db" \
            || echo "[$$(date -Iseconds)] backup FAILED"
          find /backups -name 'grafana-*.db' -mtime +7 -delete
          sleep 86400
        done
    networks:
      - minitwit_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 32M
        reservations:
          memory: 16M
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 5
        window: 300s

  node-exporter:
    image: prom/node-exporter:v1.8.2
    # No host port — Prometheus scrapes us via overlay DNS
    # (`tasks.node-exporter:9100`).
    networks:
      - minitwit_net
    deploy:
      mode: global
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s

  # Per-container CPU/memory/network/IO. One task per node (global) so we see
  # every container on every droplet, including services running only on
  # workers. Prometheus reaches us via `tasks.cadvisor:8080`.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    command:
      - '--housekeeping_interval=15s'
      - '--docker_only=true'
      - '--store_container_labels=false'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - minitwit_net
    deploy:
      mode: global
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 80M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s

  # MySQL exporter for the managed DigitalOcean database. Reads the DSN from
  # MYSQLD_EXPORTER_DSN in .env — use a dedicated read-only user with grants
  # PROCESS, REPLICATION CLIENT, SELECT on performance_schema.
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    command:
      - '--collect.global_status'
      - '--collect.global_variables'
      - '--collect.info_schema.innodb_metrics'
      - '--collect.info_schema.processlist'
      - '--collect.info_schema.tables'
      - '--collect.perf_schema.eventswaits'
      - '--collect.perf_schema.tablelocks'
      - '--mysqld.address=${MYSQLD_EXPORTER_HOST:?MYSQLD_EXPORTER_HOST must be set in .env}'
      - '--mysqld.username=${MYSQLD_EXPORTER_USER:?MYSQLD_EXPORTER_USER must be set in .env}'
    environment:
      - MYSQLD_EXPORTER_PASSWORD=${MYSQLD_EXPORTER_PASSWORD:?MYSQLD_EXPORTER_PASSWORD must be set in .env}
    networks:
      - minitwit_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s

  loki:
    image: grafana/loki:2.9.4
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/loki-config.yaml
      - loki_data:/loki
    ports:
      - target: 3100
        published: 3100
        protocol: tcp
        mode: host
    networks:
      - minitwit_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 280M
        reservations:
          memory: 150M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s

  promtail:
    image: grafana/promtail:2.9.4
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    configs:
      - source: promtail_config
        target: /etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - minitwit_net
    deploy:
      mode: global
      resources:
        limits:
          memory: 80M
        reservations:
          memory: 40M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s

configs:
  promtail_config:
    name: ${PROMTAIL_CONFIG_NAME:-promtail_config}
    external: true

volumes:
  prometheus_data:
  grafana_data:
  grafana_backups:
  loki_data:
