---
exclude_paths:
  - '__pycache__/**'
  - '*.pyc'
  - '.vagrant/**'
  - 'out/**'
  - 'static/**'
  - 'templates/**'
  - 'simulator/**'
  - 'monitoring/**'
  - 'logging/**'
  - '*.pdf'
  - '*.svg'
  # Workflow YAML pins third-party actions by 40-char commit SHA. 
  #Codacy's secret scanner false-positives those SHAs as API keys.
  - '.github/workflows/**'

engines:
  ruff:
    enabled: true
  pylint:
    enabled: true
    python_version: 3
  bandit:
    enabled: true
  hadolint:
    enabled: true
  shellcheck:
    enabled: true
