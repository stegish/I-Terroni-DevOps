user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Hide nginx version in error pages and Server header.
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    # Docker's embedded DNS — lets nginx re-resolve `tasks.minitwit` instead
    # of caching the first replica's IP forever (key for rolling updates).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ----------------------------------------------------------------------
    # Default HTTP server. This is the *first-deploy* state — works without
    # any TLS cert in place. Once you bootstrap TLS by running
    # scripts/setup-tls.sh on the manager, that script rewrites this file
    # to add a TLS-aware HTTP server (redirects to https) plus a 443 server.
    # The single source of truth stays this one file; it gets committed
    # back to git after the bootstrap so subsequent CI deploys preserve it.
    # ----------------------------------------------------------------------
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Always-on Let's Encrypt http-01 challenge endpoint.
        # Used both for first issuance and for every 90-day renewal.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        # Proxy to the app on the swarm overlay network.
        # The `set` indirection forces nginx to defer DNS resolution to
        # request time — without it, nginx would refuse to start if
        # `tasks.minitwit` didn't exist yet.
        # `/` cannot be marked `internal` — it IS the public entrypoint.
        # `$upstream_app` is set from a hardcoded literal immediately above
        # the proxy_pass, NOT from a request header, so SSRF is not possible.
        # The Host header forwarding is the standard reverse-proxy pattern;
        # the upstream app does not trust it for auth/routing.
        location / {
            set $upstream_app "tasks.minitwit:5000";
            # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host, generic.nginx.security.missing-internal.missing-internal
            proxy_pass http://$upstream_app;

            proxy_http_version 1.1;
            # nosemgrep: generic.nginx.security.request-host-used.request-host-used
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }
    }
}
