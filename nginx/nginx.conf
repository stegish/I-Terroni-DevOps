user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Hide nginx version in error pages and Server header.
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    # lets nginx re-resolve `tasks.minitwit` instead of caching the first replica's IP forever (key for rolling updates).
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        # The `set` indirection forces nginx to defer DNS resolution to
        # request time — without it, nginx would refuse to start if
        # `tasks.minitwit` didn't exist yet.
        # `/` cannot be marked `internal`, it IS the public entrypoint.
        # `$upstream_app` is set from a hardcoded literal immediately above
        # the proxy_pass, so SSRF is not possible.
        location / {
            set $upstream_app "tasks.minitwit:5000";
            proxy_pass http://$upstream_app;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }
    }
}
