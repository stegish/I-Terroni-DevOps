name: Build Report PDF

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            fonts-dejavu \
            librsvg2-bin

      - name: Build report PDF
        run: |
          chmod +x scripts/build_report.sh
          ./scripts/build_report.sh

      - name: Verify required PDF name
        run: |
          test -f report/build/MSc_group_i.pdf

      - name: Upload report PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSc_group_i_report
          path: report/build/MSc_group_i.pdf

      - name: Commit and push PDF to repository
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add report/build/MSc_group_i.pdf

          if git diff --cached --quiet; then
            echo "No PDF changes to commit"
          else
            git commit -m "docs: auto-generated report PDF [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi